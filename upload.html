<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>फ़ोटो/क्लिप लाइब्रेरी अपलोडर</title>
<style>
  :root { --bg:#12161c; --card:#1c222b; --line:#2e3744; --txt:#e8ecf1; --mut:#97a3b3; --acc:#ffd23f; --ok:#4cd37b; --bad:#ff6b6b; }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--txt); font-family: system-ui, -apple-system, "Noto Sans Devanagari", sans-serif; font-size:16px; }
  h1 { font-size:22px; margin:4px 0 14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:14px; }
  label { display:block; font-size:14px; color:var(--mut); margin:10px 0 4px; }
  input, select, button { width:100%; padding:12px; font-size:16px; border-radius:10px; border:1px solid var(--line); background:#0f1318; color:var(--txt); }
  button { background:var(--acc); color:#111; font-weight:700; border:none; margin-top:12px; }
  button.sec { background:#2a3340; color:var(--txt); }
  button:disabled { opacity:.5; }
  details summary { cursor:pointer; font-weight:600; }
  .hint { color:var(--mut); font-size:13px; margin-top:6px; line-height:1.45; }
  .bar { height:10px; background:#0f1318; border-radius:6px; overflow:hidden; margin-top:10px; }
  .bar > div { height:100%; width:0; background:var(--ok); transition:width .2s; }
  #log { font-size:13px; line-height:1.5; max-height:220px; overflow:auto; margin-top:8px; white-space:pre-wrap; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  .folders div { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--line); font-size:15px; }
  .thumbs { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .thumbs img { width:64px; height:64px; object-fit:cover; border-radius:8px; }
</style>
</head>
<body>
<h1>📸 फ़ोटो/क्लिप लाइब्रेरी अपलोडर</h1>

<div class="card">
  <details id="settings">
    <summary>⚙️ सेटिंग (सिर्फ़ पहली बार)</summary>
    <label>GitHub यूज़रनाम</label>
    <input id="owner" placeholder="जैसे: ravi123" autocapitalize="none" autocomplete="off">
