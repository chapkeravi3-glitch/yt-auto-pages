<!DOCTYPE html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>फ़ोटो/क्लिप अपलोडर</title>
<style>body{margin:0;padding:16px;background:#12161c;color:#e8ecf1;font:16px system-ui,sans-serif}input,select,button{width:100%;padding:12px;margin:6px 0;font-size:16px;border-radius:10px;border:1px solid #2e3744;background:#0f1318;color:#e8ecf1;box-sizing:border-box}button{background:#ffd23f;color:#111;font-weight:700;border:0}#log div{font-size:14px;margin:4px 0}.ok{color:#4cd37b}.bad{color:#ff6b6b}small{color:#97a3b3}</style></head><body>
<h2>📸 फ़ोटो/क्लिप अपलोडर</h2>
<details id="s"><summary>⚙️ सेटिंग</summary>
<input id="o" placeholder="GitHub यूज़रनाम" autocapitalize="none"><input id="r" placeholder="repository का नाम" autocapitalize="none"><input id="t" type="password" placeholder="token"><button id="sv">सेव करो</button></details>
<select id="c"><option>cricket</option><option>movies</option><option>fact</option></select>
<input id="n" placeholder="नाम (अंग्रेज़ी, 2-3 शब्द) जैसे shubman gill, या general" autocapitalize="none">
<input id="f" type="file" accept="image/*,video/*" multiple>
<small>क्लिप 30 MB से छोटी रखो</small>
<button id="u">⬆️ अपलोड करो</button><div id="log"></div>
<script>
const $=i=>document.getElementById(i),sl=ms=>new Promise(r=>setTimeout(r,ms)),K="plu2";
function cfg(){return{o:$("o").value.trim(),r:$("r").value.trim(),t:$("t").value.trim()}}
function lg(m,b){const d=document.createElement("div");d.textContent=m;d.className=b===true?"bad":b===false?"ok":"";$("log").appendChild(d)}
try{const c=JSON.parse(localStorage.getItem(K)||"{}");$("o").value=c.o||"";$("r").value=c.r||"";$("t").value=c.t||"";if(!(c.o&&c.r&&c.t))$("s").open=true}catch(e){$("s").open=true}
$("sv").onclick=()=>{try{localStorage.setItem(K,JSON.stringify(cfg()));lg("सेव हो गया",false)}catch(e){lg("सेव नहीं हुआ",true)}};
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
const isV=f=>(f.type||"").startsWith("video/")||/\.(mp4|mov|webm|mkv|m4v)$/i.test(f.name);
function b64(x){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(",")[1]||"");fr.onerror=()=>rej(new Error("फ़ाइल नहीं पढ़ी"));fr.readAsDataURL(x)})}
async function img(file){const bm=await createImageBitmap(file);const r=Math.min(1,1600/Math.max(bm.width,bm.height));const cv=document.createElement("canvas");cv.width=Math.round(bm.width*r);cv.height=Math.round(bm.height*r);cv.getContext("2d").drawImage(bm,0,0,cv.width,cv.height);const bl=await new Promise(x=>cv.toBlob(x,"image/jpeg",0.86));return b64(bl)}
async function put(c,path,data,msg){let last="";for(let a=0;a<4;a++){let rs;try{rs=await fetch("https://api.github.com/repos/"+c.o+"/"+c.r+"/contents/"+path,{method:"PUT",headers:{Authorization:"Bearer "+c.t,Accept:"application/vnd.github+json","Content-Type":"application/json"},body:JSON.stringify({message:msg,content:data,branch:"main"})})}catch(e){last="नेटवर्क दिक्कत";await sl(3000*(a+1));continue}
if(rs.ok)return;let d="";try{d=(await rs.json()).message||""}catch(e){}const l=d.toLowerCase();
if(rs.status==401)throw new Error("token गलत या ख़त्म (401)");
if(rs.status==404)throw new Error("repository नहीं मिली या token को अनुमति नहीं (404)");
if(rs.status==403&&/rate|secondary|abuse/.test(l)){last="GitHub ने रफ़्तार रोकी";await sl(15000*(a+1));continue}
if(rs.status==403)throw new Error("token को लिखने की अनुमति नहीं (403): Contents को Read and write करो");
if(rs.status==409||rs.status==429){last=d;await sl(5000*(a+1));continue}
throw new Error(rs.status+" "+d)}throw new Error(last||"GitHub ने रोका")}
$("u").onclick=async()=>{const c=cfg();if(!c.o||!c.r||!c.t){$("s").open=true;lg("पहले सेटिंग भरो",true);return}
const nm=slug($("n").value);if(!nm){lg("नाम लिखो",true);return}if(nm.split("-").length>4){lg("नाम छोटा रखो (2-3 शब्द)",true);return}
const fs=Array.from($("f").files||[]);if(!fs.length){lg("फ़ाइल चुनो",true);return}
$("u").disabled=true;const cat=$("c").value,st=Date.now().toString(36);let ok=0,bad=0,sk=0;
for(let i=0;i<fs.length;i++){const f=fs[i];try{let d,ext;if(isV(f)){if(f.size>31457280)throw new Error("क्लिप 30 MB से बड़ी है");d=await b64(f);ext=(f.name.split(".").pop()||"mp4").toLowerCase();if(!/^(mp4|mov|webm|mkv|m4v)$/.test(ext))ext="mp4"}else{d=await img(f);ext="jpg"}
await put(c,"photos/"+cat+"/"+nm+"/"+st+"-"+(i+1)+"."+ext,d,"जोड़ा: "+cat+"/"+nm);ok++;sk=0;lg("✔ "+(i+1)+"/"+fs.length,false)}catch(e){bad++;sk++;lg("✘ "+(i+1)+"/"+fs.length+" "+f.name+": "+e.message,true);if(sk>=2){lg("लगातार 2 फेल, रुक गया",true);break}}await sl(1500)}
lg("पूरा: "+ok+" अपलोड, "+bad+" फेल",bad>0);$("u").disabled=false};
</script></body></html>
